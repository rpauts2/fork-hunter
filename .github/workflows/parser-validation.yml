name: Russian Parser Validation

on:
  push:
    branches: [work/core-engine-refactor]
    paths:
      - "crates/parsers/**"
      - "crates/shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/parser-validation.yml"
  pull_request:
    branches: [work/core-engine-refactor]
    paths:
      - "crates/parsers/**"
      - "crates/shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/parser-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: russian-parser-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check parser crate and all targets
        run: cargo check -p parsers --all-targets --quiet

      - name: Run parser tests
        run: cargo test -p parsers --all-targets -- --test-threads=1

      - name: Check parser formatting
        run: cargo fmt -p parsers -- --check
